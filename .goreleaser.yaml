# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

builds:
  - id: protoc-gen-connect-ktor
    dir: "./protoc-gen-connect-ktor"
    main: "./cmd/protoc-gen-connect-ktor"
    binary: protoc-gen-connect-ktor
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.build={{.Version}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: protoc-gen-connect-ktor
    formats: tar.gz
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: zip

sboms:
  - artifacts: archive
    documents:
      - "${artifact}.cdx.sbom.json"
    cmd: syft
    args:
      - "$artifact"
      - "--output"
      - "cyclonedx-json=$document"

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes
    artifacts: all
    output: true

# Changelog body is supplied by CI via --release-notes (Tegami / CHANGELOG.md).
# Keep filters only as a fallback if notes are omitted.
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

gomod:
  dir: ./protoc-gen-connect-ktor

report_sizes: true

release:
  draft: true
