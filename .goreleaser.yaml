# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

builds:
  - id: protoc-gen-connect-ktor
    dir: "./protoc-gen-connect-ktor"
    main: "./cmd/protoc-gen-connect-ktor"
    binary: protoc-gen-connect-ktor
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.build={{.Version}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: protoc-gen-connect-ktor
    formats: tar.gz
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: zip

sboms:
  - artifacts: archive
    documents:
      - "${artifact}.cdx.sbom.json"
    cmd: syft
    args:
      - "$artifact"
      - "--output"
      - "cyclonedx-json=$document"

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes
    artifacts: all
    output: true

# Changelog body is supplied by CI via --release-notes (Tegami / CHANGELOG.md).
# Keep filters only as a fallback if notes are omitted.
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

gomod:
  dir: ./protoc-gen-connect-ktor

report_sizes: true

release:
  draft: true

# NOTE: GoReleaser's built-in Homebrew formula template always emits an
# explicit `version "x.y.z"` line, regardless of what is configured here —
# there is no `brews` field to suppress it (upstream limitation, tracked at
# https://github.com/goreleaser/goreleaser/issues/1908). Since our download
# URLs already embed the version, `brew audit` flags that line as redundant.
# The `plugin` job in .github/workflows/release.yml strips it from the
# formula committed to homebrew-tap right after this pipe runs.
brews:
  - name: protoc-gen-connect-ktor
    ids:
      - protoc-gen-connect-ktor
    repository:
      owner: ichizero
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Formula
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    description: "Protoc plugin to generate Ktor server code"
    homepage: "https://github.com/ichizero/connect-ktor"
