packages:
  - apps/*

savePrefix: ""
catalogMode: prefer
# Keep pnpm's default 1-day maturity gate, but non-strict so freshly
# pinned catalog versions remain installable. Dependabot's 7-day
# cooldown still delays automated bumps.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: false

allowBuilds:
  esbuild: true

catalog:
  "@base-ui/react": 1.8.0
  "@fumapress/tegami": 1.1.2
  "@tailwindcss/vite": 4.3.3
  "@types/mdx": 2.0.14
  "@types/node": 26.5.0
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.7
  fumadocs-core: 16.15.8
  fumadocs-mdx: 15.4.0
  fumadocs-ui: npm:@fumadocs/base-ui@16.15.8
  fumapress: 1.2.0
  lucide-react: 1.43.0
  oxfmt: 0.67.0
  react: 19.2.8
  react-dom: 19.2.8
  tailwindcss: 4.3.3
  tegami: 1.5.0
  typescript: 7.0.2
  vite: 8.2.2
