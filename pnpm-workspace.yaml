packages:
  - apps/*

savePrefix: ""
catalogMode: prefer
confirmModulesPurge: false
# Keep pnpm's default 1-day maturity gate, but non-strict so freshly
# pinned catalog versions remain installable. Dependabot's 7-day
# cooldown still delays automated bumps.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: false

allowBuilds:
  esbuild: true

catalog:
  "@base-ui/react": 1.7.0
  "@fumapress/tegami": 0.7.3
  "@tailwindcss/vite": 4.3.3
  "@types/mdx": 2.0.14
  "@types/node": 26.2.0
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.4
  fumadocs-core: 16.14.5
  fumadocs-mdx: 15.3.0
  fumadocs-ui: npm:@fumadocs/base-ui@16.14.5
  fumapress: 0.7.3
  lucide-react: 1.33.0
  oxfmt: 0.64.0
  react: 19.2.8
  react-dom: 19.2.8
  react-server-dom-webpack: 19.2.8
  tailwindcss: 4.3.3
  tegami: 1.4.0
  typescript: 7.0.2
  waku: 1.0.0-beta.9
