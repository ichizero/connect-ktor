# Unified release pipeline (Tegami versioning/tags + GoReleaser + Maven).
#
# On push to main:
#   1. `pnpm tegami ci` — open/update Version Packages PR, or publish (create v* tag)
#   2. When a publish just became due, run GoReleaser (draft release + artifacts)
#      and Maven Central publish in the same workflow (avoids GITHUB_TOKEN tag-push
#      not triggering a separate tag workflow).
#
# GoReleaser runs on the main checkout after Tegami creates the tag locally/remotely.
# Tag selection uses GORELEASER_CURRENT_TAG; git validate requires the tag to point
# at HEAD (true for Tegami tags created on the merge commit).
#
# After a successful tag publish, `.tegami/publish-lock.yaml` may remain on main.
# That is intentional: once tags exist, Tegami publish status is `success`, so
# `check-publish` will not re-trigger GoReleaser/Maven. The next Version Packages
# PR (`tegami version` / `tegami ci` versioning) replaces or removes the spent
# lock — this workflow never pushes cleanup commits to main.
#
# Releases are immutable: there is no workflow_dispatch re-release path.
#
# Concurrency serializes overlapping main pushes so two runs cannot both see
# check-publish as pending and invoke `pnpm tegami ci` publish at once.
# queue: max keeps pending runs in FIFO order (default single pending would
# cancel an earlier queued release when a newer main push arrives).
# cancel-in-progress is false so an in-flight Maven/GoReleaser publish is never aborted.
name: release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release: ${{ steps.result.outputs.release }}
      tag: ${{ steps.result.outputs.tag }}
      version: ${{ steps.result.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0

      - name: Check whether publish is pending
        id: check
        run: |
          set -euo pipefail
          # tegami check-publish: 0 = pending, 1 = nothing to publish; other codes fail.
          set +e
          pnpm tegami check-publish
          status=$?
          set -e
          if [[ "$status" -eq 0 ]]; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          elif [[ "$status" -eq 1 ]]; then
            echo "pending=false" >> "$GITHUB_OUTPUT"
          else
            echo "tegami check-publish failed with exit code ${status}" >&2
            exit "$status"
          fi

      # Git credentials: tegami github plugin initCli sets origin via GITHUB_TOKEN when CI=true.
      - name: Version & publish
        run: pnpm tegami ci
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI: true

      - name: Resolve tag after Tegami publish
        id: published
        if: steps.check.outputs.pending == 'true'
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v${version}"

          # Tegami creates the tag on HEAD in this workspace; also refresh from origin.
          git fetch --tags --force origin "refs/tags/${tag}:refs/tags/${tag}" || true
          if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "expected tag ${tag} after tegami publish, but it is missing" >&2
            exit 1
          fi
          head_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-list -n1 "refs/tags/${tag}")"
          if [[ "$head_sha" != "$tag_sha" ]]; then
            echo "tag ${tag} (${tag_sha}) does not point at HEAD (${head_sha})" >&2
            exit 1
          fi

          {
            echo "release=true"
            echo "tag=${tag}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"

      - name: Set job outputs
        id: result
        env:
          PUBLISHED_RELEASE: ${{ steps.published.outputs.release }}
          PUBLISHED_TAG: ${{ steps.published.outputs.tag }}
          PUBLISHED_VERSION: ${{ steps.published.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "${PUBLISHED_RELEASE:-}" == "true" ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tag=${PUBLISHED_TAG}" >> "$GITHUB_OUTPUT"
            echo "version=${PUBLISHED_VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

  plugin:
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "./protoc-gen-connect-ktor/go.mod"
          cache-dependency-path: "./protoc-gen-connect-ktor/go.sum"
          cache: false

      - name: Install syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Write Tegami release notes
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x ./scripts/tegami-release-notes.sh
          ./scripts/tegami-release-notes.sh "$RELEASE_VERSION" > /tmp/tegami-release-notes.md
          {
            echo "----- release notes -----"
            cat /tmp/tegami-release-notes.md
            echo "----- end release notes -----"
          }

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          args: release --clean --release-notes=/tmp/tegami-release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ needs.prepare.outputs.tag }}

      - name: Generate SLSA build provenance for Go release archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

  library:
    runs-on: ubuntu-latest
    needs: [prepare, plugin]
    if: needs.prepare.outputs.release == 'true'
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: go
          cache: false

      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ github.token }}

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build project
        run: mise run build
        env:
          ORG_GRADLE_PROJECT_releaseVersion: ${{ needs.prepare.outputs.version }}

      - name: Assemble library JAR
        run: ./gradlew :library:assemble
        env:
          ORG_GRADLE_PROJECT_releaseVersion: ${{ needs.prepare.outputs.version }}

      - name: Generate SLSA build provenance for library JARs
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            library/build/libs/*.jar

      - name: Publish to Central Repository
        run: ./gradlew publishToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
          ORG_GRADLE_PROJECT_releaseVersion: ${{ needs.prepare.outputs.version }}

      - name: Generate CycloneDX SBOM
        run: ./gradlew :library:cyclonedxBom
        env:
          ORG_GRADLE_PROJECT_releaseVersion: ${{ needs.prepare.outputs.version }}

      - name: Attach SBOM to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            "library/build/reports/bom.json#library-${RELEASE_VERSION}-cyclonedx.json" \
            --clobber

  update-homebrew-tap:
    needs: [prepare, plugin, library]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Calculate source archive checksum
        id: source
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/connect-ktor-source.tar.gz" \
            "https://github.com/ichizero/connect-ktor/archive/refs/tags/${RELEASE_TAG}.tar.gz"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/connect-ktor-source.tar.gz" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ichizero/homebrew-tap
          path: homebrew-tap
          persist-credentials: false

      - name: Prepare Formula update
        id: formula
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA256: ${{ steps.source.outputs.sha256 }}
        run: |
          set -euo pipefail
          python3 scripts/update-homebrew-formula.py \
            homebrew-tap/Formula/protoc-gen-connect-ktor.rb \
            "$RELEASE_TAG" "$SOURCE_SHA256"
          if git -C homebrew-tap diff --quiet -- Formula/protoc-gen-connect-ktor.rb; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git -C homebrew-tap diff --check
            git -C homebrew-tap diff -- Formula/protoc-gen-connect-ktor.rb
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open tap update PR
        if: steps.formula.outputs.changed == 'true'
        # Scope this secret to homebrew-tap with Contents and Pull requests write.
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "TAP_GITHUB_TOKEN is required to create the tap PR" >&2
            exit 1
          fi
          branch="automation/protoc-gen-connect-ktor-${RELEASE_TAG}"
          existing_pr="$(gh pr list --repo ichizero/homebrew-tap --state open \
            --head "$branch" --json url --jq '.[0].url // empty')"
          if [[ -n "$existing_pr" ]]; then
            echo "Tap update PR already exists: $existing_pr"
            exit 0
          fi

          closed_pr="$(gh pr list --repo ichizero/homebrew-tap --state closed \
            --head "$branch" --json url --jq '.[0].url // empty')"
          if [[ -n "$closed_pr" ]]; then
            echo "Tap update PR was closed: $closed_pr; review it before retrying" >&2
            exit 1
          fi

          set +e
          git -C homebrew-tap ls-remote --exit-code --heads origin "$branch" >/dev/null
          branch_status=$?
          set -e
          if [[ "$branch_status" -eq 0 ]]; then
            git -C homebrew-tap fetch --no-tags origin "refs/heads/${branch}"
            changed_paths="$(git -C homebrew-tap diff --name-only HEAD FETCH_HEAD)"
            if [[ "$changed_paths" != 'Formula/protoc-gen-connect-ktor.rb' ]]; then
              echo "Existing tap branch changes unexpected files: $branch" >&2
              exit 1
            fi
            if ! cmp -s homebrew-tap/Formula/protoc-gen-connect-ktor.rb \
              <(git -C homebrew-tap show FETCH_HEAD:Formula/protoc-gen-connect-ktor.rb); then
              echo "Existing tap branch differs from the generated Formula: $branch" >&2
              exit 1
            fi
          elif [[ "$branch_status" -eq 2 ]]; then
            git -C homebrew-tap switch -c "$branch"
            git -C homebrew-tap config user.name 'github-actions[bot]'
            git -C homebrew-tap config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C homebrew-tap add Formula/protoc-gen-connect-ktor.rb
            git -C homebrew-tap commit -m "chore(homebrew): update protoc-gen-connect-ktor to ${RELEASE_TAG}"
            gh auth setup-git --hostname github.com
            git -C homebrew-tap push --set-upstream origin "$branch"
          else
            echo "Could not check for existing tap branch: $branch" >&2
            exit "$branch_status"
          fi

          cat > "$RUNNER_TEMP/tap-pr.md" <<EOF
          Update the source Formula to [connect-ktor ${RELEASE_TAG}](https://github.com/ichizero/connect-ktor/releases/tag/${RELEASE_TAG}).

          The tap's pull request CI builds and audits the Formula and checks that bottles can be built on macOS 26, macOS 27, and Linux. After merge, the tap publishes bottles built on main.
          EOF
          gh pr create --repo ichizero/homebrew-tap --base main --head "$branch" \
            --title "chore(homebrew): update protoc-gen-connect-ktor to ${RELEASE_TAG}" \
            --body-file "$RUNNER_TEMP/tap-pr.md"
