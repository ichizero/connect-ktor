# Posts a Tegami release-preview comment on pull requests.
#
# Official Tegami docs split generate vs comment across two workflows
# (pull_request + workflow_run). This repo keeps both steps in one
# pull_request job: workflow_run was removed to satisfy zizmor, while still
# using the official CLI (`pr preview --artifact` then `pr comment`).
# See https://tegami.fuma-nama.dev/ci#pull-request-preview and CONTRIBUTING.md.
name: tegami-pr

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 11.18.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release preview
        run: pnpm tegami pr preview --artifact tegami-pr-preview.md

      # Fork PRs get a read-only GITHUB_TOKEN on pull_request, so commenting
      # would fail. Preview generation above still runs for contributors.
      - name: Post preview comment
        if: ${{ !github.event.pull_request.head.repo.fork }}
        run: pnpm tegami pr comment tegami-pr-preview.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
