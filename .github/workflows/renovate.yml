name: Renovate auto-approve
on: pull_request
permissions: {}
jobs:
  approve:
    runs-on: ubuntu-latest
    # Renovate PRs still need a human/bot approval to satisfy branch
    # protection (a bot can't approve its own PR). Actual merging —
    # including which update types auto-merge — is handled by renovate.json5.
    if: github.event.pull_request.user.login == 'renovate[bot]' && github.repository == 'ichizero/connect-ktor'
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Approve a PR if not already approved
        run: |
          gh pr checkout "$PR_URL" # sets the upstream metadata for `gh pr status`
          if [ "$(gh pr status --json reviewDecision -q .currentBranch.reviewDecision)" != "APPROVED" ];
          then gh pr review --approve "$PR_URL"
          else echo "PR already approved, skipping additional approvals to minimize emails/notification noise.";
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
