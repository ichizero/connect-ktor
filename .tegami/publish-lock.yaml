core:changelogs:
  - content: "---\npackages:\n  connect-ktor:\n    type: minor\n---\n\n## Support Connect GET for idempotent unary RPCs\n\nIdempotent unary RPCs (protobuf `NO_SIDE_EFFECTS`) can now be served over HTTP GET\nwith the Connect query-parameter encoding. The code generator emits GET routes for\neligible methods, and custom JSON strategies (for example TypeRegistry for\n`google.protobuf.Any`) can be registered via `installConnectGetCodecs`.\n\n[PR #194](https://github.com/ichizero/connect-ktor/pull/194)\n"
    filename: 2026-07-15-connect-get.md
    v: 0.0.0
  - content: "---\npackages:\n  connect-ktor:\n    type: minor\n---\n\n## Support message receive size limits\n\n`Route.connectBodyLimit(maxBytes)` enforces a maximum inbound message size for\nunary Connect RPCs and returns `resource_exhausted` when the limit is exceeded.\nCompressed requests are measured after decompression so gzip bombs cannot bypass\nthe cap.\n\n[PR #195](https://github.com/ichizero/connect-ktor/pull/195)\n"
    filename: 2026-07-25-message-receive-limit.md
    v: 0.0.0
  - content: "---\npackages:\n  connect-ktor:\n    type: minor\n---\n\n## Support unary compression negotiation\n\nUnary Connect RPCs negotiate request compression through Ktor's Compression plugin.\n`UnaryCompressionGuard` validates `Content-Encoding` before the body is read and\nrejects unsupported encodings with `Code.UNIMPLEMENTED`.\n\n[PR #193](https://github.com/ichizero/connect-ktor/pull/193)\n"
    filename: 2026-07-25-unary-compression.md
    v: 0.0.0
